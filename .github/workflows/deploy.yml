name: Staging / Production deploy (gated)

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      confirm_aws_gates:
        description: 'Type APPROVED only if DOST budget/residency/network gates are cleared'
        required: true
        type: string
        default: ''

concurrency:
  group: deploy-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target }}"
          CONFIRM="${{ github.event.inputs.confirm_aws_gates }}"
          if [ "$CONFIRM" != "APPROVED" ]; then
            echo "::error::Decision Gate not cleared. Set confirm_aws_gates=APPROVED only after DOST PM approval."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$TARGET" = "production" ] && [ "${{ secrets.ALLOW_PRODUCTION_DEPLOY }}" != "true" ]; then
            echo "::error::Production deploy blocked: ALLOW_PRODUCTION_DEPLOY secret must be 'true'."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "Gate passed for target=$TARGET"

  ci-smoke:
    name: CI gate
    needs: gate
    if: needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, exif, pcntl, bcmath, gd, zip, pdo_mysql
          coverage: none
          ini-values: post_max_size=20M, upload_max_filesize=20M

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run migrations and tests
        run: |
          cp .env.example .env
          php artisan key:generate --force
          php artisan migrate --force --no-interaction
          php artisan db:seed --class=Database\\Seeders\\RolesAndPermissionsSeeder --force
          vendor/bin/phpunit --colors=always --testdox
        env:
          APP_ENV: testing
          APP_DEBUG: true
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'

  staging-smoke:
    needs: gate
    if: github.event.inputs.target == 'staging' && needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Remote staging health
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_URL:-}" ]; then
            echo "STAGING_URL secret not set — skipping remote curl."
            exit 0
          fi
          curl -fsS --retry 5 --retry-delay 2 "${STAGING_URL%/}/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json || grep -q '"status": "ok"' /tmp/health.json
          echo "Staging /health OK"

  production-placeholder:
    needs: gate
    if: github.event.inputs.target == 'production' && needs.gate.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Block until IaC exists
        run: |
          set -euo pipefail
          echo "::error::Production deploy path is not wired yet."
          echo "Complete AWS Decision Gate + Terraform outputs before enabling this job."
          exit 1
