name: Staging / Production deploy (gated)

# Path 3: CI smoke first; AWS/prod deploy only after Decision Gate in
# planning/AWS_PRODUCTION_DEPLOYMENT_PROMPT.md. This workflow never auto-deploys.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy target
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging
      confirm_aws_gates:
        description: 'Type APPROVED only if DOST budget/residency/network gates are cleared'
        required: true
        type: string
        default: ''

concurrency:
  group: deploy-${{ github.event.inputs.target }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - id: check
        run: |
          set -euo pipefail
          TARGET="${{ github.event.inputs.target }}"
          CONFIRM="${{ github.event.inputs.confirm_aws_gates }}"
          if [ "$CONFIRM" != "APPROVED" ]; then
            echo "::error::Decision Gate not cleared. Set confirm_aws_gates=APPROVED only after DOST PM approval (see planning/AWS_PRODUCTION_DEPLOYMENT_PROMPT.md)."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ "$TARGET" = "production" ] && [ "${{ secrets.ALLOW_PRODUCTION_DEPLOY }}" != "true" ]; then
            echo "::error::Production deploy blocked: repository secret ALLOW_PRODUCTION_DEPLOY must be 'true'."
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "allowed=true" >> "$GITHUB_OUTPUT"
          echo "Gate passed for target=$TARGET"

  staging-smoke:
    needs: gate
    if: github.event.inputs.target == 'staging'
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v7
      - name: Remote staging health (optional)
        env:
          STAGING_URL: ${{ secrets.STAGING_URL }}
        run: |
          set -euo pipefail
          if [ -z "${STAGING_URL:-}" ]; then
            echo "STAGING_URL secret not set — skipping remote curl."
            echo "Provision staging (or set STAGING_URL) after AWS Decision Gate, then re-run."
            echo "Local/CI synthetic coverage remains in test.yml job synthetic-smoke."
            exit 0
          fi
          curl -fsS --retry 5 --retry-delay 2 "${STAGING_URL%/}/health" | tee /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json || grep -q '"status": "ok"' /tmp/health.json
          echo "Staging /health OK"

  production-placeholder:
    needs: gate
    if: github.event.inputs.target == 'production'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Block until IaC exists
        run: |
          set -euo pipefail
          echo "::error::Production deploy path is not wired yet (no infrastructure/aws IaC)."
          echo "Complete AWS Decision Gate + Terraform outputs before enabling this job."
          exit 1
