name: Security & Dependency Audit

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * 1'

jobs:
  audit:
    name: Dependency & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
          ini-values: post_max_size=20M, upload_max_filesize=20M

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Composer audit
        run: composer audit --no-interaction --format=table

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: npm audit
        run: npm audit --omit=dev || true

      - name: Secret scan with gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

      - name: Detect high-risk file changes
        run: |
          set -euo pipefail
          echo "::group::Changed files"
          git diff --name-only origin/${GITHUB_BASE_REF:-master}...HEAD || true
          echo "::endgroup::"

          HIGH_RISK_PATTERNS='\.env$|^\.env\.|google_client_secret\.json|private key|BEGIN RSA|api[_-]?key|token[_-]?secret'
          CHANGED=$(git diff --name-only origin/${GITHUB_BASE_REF:-master}...HEAD || true)
          if [ -z "$CHANGED" ]; then
            echo "No changed files detected."
            exit 0
          fi

          MATCH=$(echo "$CHANGED" | grep -E "$HIGH_RISK_PATTERNS" || true)
          if [ -n "$MATCH" ]; then
            echo "::error::High-risk file change detected:"
            echo "$MATCH"
            exit 1
          fi

  license-scan:
    name: License Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: License audit
        run: composer licenses --no-interaction --format=table || true
