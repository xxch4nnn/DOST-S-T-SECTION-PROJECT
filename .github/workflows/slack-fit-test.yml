name: Slack Fit Test

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack via bot (fit-test channel)
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          # Fit-test target: #dostorage-pm (bot allowed_channels). Change after expanding Hermes allowlist.
          SLACK_CI_CHANNEL_ID: C0BJV9GF38V
        run: |
          TOKEN="$(printf '%s' "$SLACK_BOT_TOKEN" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [ -z "$TOKEN" ]; then
            echo "SLACK_BOT_TOKEN secret is empty."
            exit 1
          fi
          RESP="$(curl -fsS -X POST https://slack.com/api/chat.postMessage \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Content-type: application/json; charset=utf-8' \
            --data "{\"channel\":\"${SLACK_CI_CHANNEL_ID}\",\"text\":\":white_check_mark: DOSTorage V1 Slack fit test — pipeline ran successfully.\"}")"
          echo "$RESP" | tee /tmp/slack_resp.json
          echo "$RESP" | grep -q '"ok":true' || { echo "Slack API rejected the post"; exit 1; }
