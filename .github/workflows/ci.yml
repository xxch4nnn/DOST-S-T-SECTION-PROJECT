name: CI

on:
  pull_request:
    branches: [master, main]
    paths:
      - '**.php'
      - 'composer.json'
      - 'package.json'
      - 'ai/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  push:
    branches: [master, main]
    paths:
      - '**.php'
      - 'composer.json'
      - 'package.json'
      - 'ai/**'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

jobs:
  aiops:
    name: AIOps Artifact Validation
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, 'chore(ai)') ||
      true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Validate model manifests
        run: |
          set -euo pipefail
          find ai/models -name manifest.json -print0 | while IFS= read -r -d '' manifest; do
            python scripts/validate_model_schema.py --manifest "$manifest"
          done

      - name: Validate prompt contracts
        run: |
          set -euo pipefail
          find ai/prompts -name prompt.json -print0 | while IFS= read -r -d '' contract; do
            python scripts/validate_prompt_contract.py --contract "$contract"
          done

  lint-static:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, exif, pcntl, bcmath, gd, zip, pdo_mysql
          coverage: none
          ini-values: post_max_size=20M, upload_max_filesize=20M

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Lint PHP
        run: vendor/bin/pint --test

      - name: Static analysis
        run: vendor/bin/phpstan analyse --no-progress --configuration=phpstan.neon || true

  tests:
    name: Tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: dostorage
          MYSQL_USER: dostorage
          MYSQL_PASSWORD: secret
        ports:
          - 3306/tcp
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -psecret"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, exif, pcntl, bcmath, gd, zip, pdo_mysql
          coverage: xdebug
          ini-values: post_max_size=20M, upload_max_filesize=20M

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
        env:
          APP_ENV: testing
          APP_DEBUG: true
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dostorage
          DB_USERNAME: dostorage
          DB_PASSWORD: secret

      - name: Run migrations & seed baseline
        run: |
          php artisan migrate --force --no-interaction
          php artisan db:seed --class=Database\\Seeders\\RolesAndPermissionsSeeder --force
        env:
          APP_ENV: testing
          APP_DEBUG: true
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dostorage
          DB_USERNAME: dostorage
          DB_PASSWORD: secret

      - name: Run test suite
        run: vendor/bin/phpunit --colors=always --testdox
        env:
          APP_ENV: testing
          APP_DEBUG: true
          APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: dostorage
          DB_USERNAME: dostorage
          DB_PASSWORD: secret

  build:
    name: Build Frontend Artifacts
    runs-on: ubuntu-latest
    needs: [lint-static, tests]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build assets
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: public-build
          path: public/build
          retention-days: 7
