services:
  inference:
    build:
      context: ../..
      dockerfile: inference-service/Dockerfile
    image: dostorage-inference:dev
    ports:
      - "${INFERENCE_PORT:-8080}:8080"
    environment:
      APP_ENV: local
      LOG_LEVEL: info
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
